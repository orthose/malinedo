{% extends "admin/base_site.html" %}

{% block content %}
<form method="post">
    {% csrf_token %}

    {{ form.non_field_errors }}

    {% for field in form %}
        <div>
            {{ field.label_tag }}
            {{ field }}

            {% if field.errors %}
                {{ field.errors }}
            {% endif %}
        </div>
    {% endfor %}

    <div class="submit-row">
        <input type="submit" value="Exécuter" class="default" />
    </div>
</form>
{% endblock %}
